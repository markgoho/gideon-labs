name: Node CI

on:
  push:
    paths:
      - 'hugo/**'
      - '.github/workflows/deploy-hugo.yml'
      - 'firebase.json'
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true

      - uses: actions/checkout@v5
        with:
          submodules: 'true'

      - run: cd hugo && hugo --minify
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: gideonlabs-b4b71
          # 15.34.1 needs the Service Usage API enabled on the project. Unpin once it is.
          firebaseToolsVersion: 15.34.0
          target: production
