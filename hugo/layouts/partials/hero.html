<section class="hero-container">
  <div class="hero-text">
    <h1 class="hero-tagline">{{ hugo.Data.home.tagline }}</h1>
    <h2 class="sub-header">
      {{ hugo.Data.home.subheader }}
    </h2>
    <a href="/contact/" class="call-to-action">{{ hugo.Data.home.cta }}</a>
  </div>

  <picture>
    <source srcset="/img/microscope.webp" type="image/webp" />
    <img
      class="hero-image"
      src="/img/microscope.png"
      alt="microscope"
      loading="lazy"
      width="275"
      height="367" />
  </picture>
</section>
