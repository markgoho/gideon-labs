<section class="steps">
  <div class="section-header">
    <h2 class="section-title">{{ hugo.Data.home.stepsTitle }}</h2>
    <div class="separator"></div>
  </div>

  <div class="step-container">
    <div class="step step1">
      <img class="step-svg" src="/img/step1.svg" alt="step one graphic" loading="lazy" >
      <p class="step-description">{{ index hugo.Data.home.steps 0 }}</p>
    </div>

    <div class="step step2">
      <img class="step-svg" src="/img/step2.svg" alt="step two graphic" loading="lazy"/>
      <p class="step-description">{{ index hugo.Data.home.steps 1 }}</p>
    </div>

    <div  class="step step3">
      <img class="step-svg" src="/img/step3.svg" alt="step three graphic" loading="lazy" />
      <p class="step-description">{{ index hugo.Data.home.steps 2 }}</p>
    </div>
  </div>
</section>
