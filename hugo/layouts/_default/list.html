{{ define "main" }}
<section class="wrap list-head">
  <div class="list-head__text">
    <h1>{{ .Title }}</h1>
  </div>
  {{- with .Content }}
  <div class="prose">{{ . }}</div>
  {{- end }}
</section>
<section class="wrap list-body">
  <ul class="service-list">
    {{- range .Pages }}
    <li class="service">
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      <p>{{ with .Params.description }}{{ . }}{{ else }}{{ .Summary | plainify | htmlUnescape | truncate 160 }}{{ end }}</p>
      <a class="service__more" href="{{ .RelPermalink }}">Read more &rarr;</a>
    </li>
    {{- end }}
  </ul>
</section>
{{ end }}
